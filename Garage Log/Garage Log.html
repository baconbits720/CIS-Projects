<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Garage Log</title>
    <style>
        body {
            font-family: 'Verdana', sans-serif;
            background: radial-gradient(circle, #d0eaff, #a5c2ff);
            margin: 0;
            padding: 30px;
            color: #2d2d2d;
        }

        h1 {
            text-align: center;
            font-size: 2.4rem;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            font-weight: normal;
            margin-bottom: 30px;
        }

        .entry-form {
            max-width: 650px;
            background: #fff;
            margin: 0 auto 50px auto;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .field-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 1rem;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #3478f6;
            color: white;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #255cd3;
        }

        .vehicle-card {
            max-width: 650px;
            background: #fdfdfd;
            padding: 20px;
            margin: 0 auto 20px auto;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }

        .vehicle-card h3 {
            margin: 0 0 12px 0;
            color: #004d99;
        }
    </style>
</head>
<body>
    <h1>Garage Log</h1>
    <h2 id="registeredOwner">Owner: Tommy Orlando</h2>

    <div class="entry-form">
        <div class="field-group">
            <label for="inputFirst">First Name</label>
            <input type="text" id="inputFirst">
        </div>
        <div class="field-group">
            <label for="inputLast">Last Name</label>
            <input type="text" id="inputLast">
        </div>
        <div class="field-group">
            <label for="inputYear">Vehicle Year</label>
            <input type="number" id="inputYear">
        </div>
        <div class="field-group">
            <label for="inputMake">Make</label>
            <input type="text" id="inputMake">
        </div>
        <div class="field-group">
            <label for="inputModel">Model</label>
            <input type="text" id="inputModel">
        </div>
        <div class="field-group">
            <label for="inputTrans">Transmission</label>
            <select id="inputTrans">
                <option value="auto">Automatic</option>
                <option value="manual">Manual</option>
            </select>
        </div>
        <div class="field-group">
            <label for="inputMPG">Combined MPG</label>
            <input type="number" id="inputMPG">
        </div>
        <div class="field-group">
            <label for="inputState">State Registered</label>
            <input type="text" id="inputState">
        </div>
        <button class="submit-btn" id="logBtn">Log Vehicle</button>
    </div>

    <div id="vehicleList"></div>

    <script>
        const vehicleLog = [
            {
                make: "BMW",
                model: "M3 Competition",
                year: 2022,
                bought: "2025-04-15",
                isAuto: true,
                regState: "Pennsylvania",
                city: 16,
                highway: 23,
                label() {
                    return `${this.year} ${this.make} ${this.model}`;
                },
                avgMPG() {
                    return ((this.city + this.highway) / 2).toFixed(1);
                },
                niceDate() {
                    return new Date(this.bought).toLocaleDateString("en-US", {
                        year: "numeric",
                        month: "short",
                        day: "numeric"
                    });
                }
            }
        ];

        const vehicleList = document.getElementById("vehicleList");

        function showVehicle(v) {
            const card = document.createElement("div");
            card.className = "vehicle-card";

            const title = document.createElement("h3");
            title.textContent = v.label();

            const info = document.createElement("p");
            info.innerHTML = `
                <strong>Combined MPG:</strong> ${v.avgMPG()}<br>
                <strong>Purchased:</strong> ${v.niceDate()}<br>
                <strong>Transmission:</strong> ${v.isAuto ? "Automatic" : "Manual"}<br>
                <strong>Registered:</strong> ${v.regState}
            `;

            card.appendChild(title);
            card.appendChild(info);
            vehicleList.appendChild(card);
        }

        vehicleLog.forEach(showVehicle);

        document.getElementById("logBtn").addEventListener("click", () => {
            const first = document.getElementById("inputFirst").value.trim();
            const last = document.getElementById("inputLast").value.trim();
            const year = parseInt(document.getElementById("inputYear").value);
            const make = document.getElementById("inputMake").value.trim();
            const model = document.getElementById("inputModel").value.trim();
            const trans = document.getElementById("inputTrans").value;
            const mpg = parseFloat(document.getElementById("inputMPG").value);
            const state = document.getElementById("inputState").value.trim();

            if (first && last) {
                document.getElementById("registeredOwner").textContent = `Owner: ${first} ${last}`;
            }

            const entry = {
                make,
                model,
                year,
                bought: new Date().toISOString(),
                isAuto: trans === "auto",
                regState: state,
                city: mpg,
                highway: mpg,
                label() {
                    return `${this.year} ${this.make} ${this.model}`;
                },
                avgMPG() {
                    return ((this.city + this.highway) / 2).toFixed(1);
                },
                niceDate() {
                    return new Date(this.bought).toLocaleDateString("en-US", {
                        year: "numeric",
                        month: "short",
                        day: "numeric"
                    });
                }
            };

            showVehicle(entry);
        });
    </script>
</body>
</html>
